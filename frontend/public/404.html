<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo Auction Arena</title>
    <script>
      // SPA Fallback: Redirect deep links (e.g. /AdminDashboard, /UserDashboard) back to index.html
      var currentPath = window.location.pathname;
      var currentSearch = window.location.search;
      var currentHash = window.location.hash;
      
      if (currentPath && currentPath !== '/') {
        window.location.replace('/?route=' + encodeURIComponent(currentPath + currentSearch + currentHash));
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 40px; color: #1e3a8a;">
    <h2>Loading Bingo Auction Arena...</h2>
  </body>
</html>
