<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Bingo Auction Arena</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect handler
      var path = window.location.pathname;
      var repo = '/Bingo-Auction-Technovit';
      var route = path;
      if (path.startsWith(repo)) {
        route = path.slice(repo.length);
      }
      var target = repo + '/?page=' + encodeURIComponent(route) + (window.location.search ? '&' + window.location.search.slice(1) : '') + window.location.hash;
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to Bingo Auction Arena...</p>
  </body>
</html>
